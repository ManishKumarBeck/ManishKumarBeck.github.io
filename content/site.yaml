about:
  paragraphs:
    - >-
      I'm a software and DevOps engineer with more than five years of experience
      across backend systems, cloud infrastructure and AI integrations, working
      mainly in Python and AWS. I'm currently at Albaik Food Labs.
    - >-
      Most of my recent engineering has gone into LLM applications. FloorTrace is
      an incident-investigation agent with code-checked citations, run tracing and
      a published eval suite that compares models and prompt versions. McqGen grew
      from a small LangChain script into a full-stack exam platform with hybrid
      retrieval and page-level citations.
    - >-
      I came to this through real-time software, building Unity games and AR/VR
      prototypes and publishing apps on Google Play. That work still shapes how I
      think about state, performance and what a user actually experiences.
  areas:
    - title: AI engineering and LLM applications
      detail: Schema-validated output, citations verified in code, eval suites with known ground truth, and prompt-injection probes.
    - title: RAG pipelines and AI agents
      detail: A LangGraph investigator with read-only tools and hard budgets, and hybrid BM25 and vector retrieval with citations down to the page.
    - title: Python backends and APIs
      detail: FastAPI, Pydantic and SQLAlchemy services with server-authoritative state and clear error handling.
    - title: Distributed systems and cloud
      detail: Exactly-once submission under concurrent requests, containers, and hands-on AWS, GCP and Azure.
    - title: DevOps, automation and observability
      detail: CI/CD with GitHub Actions, Jenkins and Bitbucket Pipelines, per-run agent tracing of latency, tokens and cost, and scheduled AWS checks.

